<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Busca de Produtos</title>
</head>
<body>

    <h1>Busca de Produtos</h1>

    <input
        type="text"
        id="busca"
        placeholder="Digite um produto"
    >

    <button onclick="buscar()">
        Buscar
    </button>

    <hr>

    <div id="resultado"></div>

    <script>
        function buscar() {
            const termo = document.getElementById("busca").value;

           // ANTES
           // O risco aqui era o uso de .innerHTML, que aceita tags HTML e abre margem para ataques de injeção de código (XSS).

            // document.getElementById("resultado").innerHTML =
            //     "Você pesquisou por: " + termo;

            // CORRIGIDO

            // Substituí por .textContent para garantir que o valor seja renderizado estritamente como texto puro, neutralizando qualquer código malicioso.

            document.getElementById("resultado").textContent =
                "Você pesquisou por: " + termo;

        }
    </script>

</body>
</html>
