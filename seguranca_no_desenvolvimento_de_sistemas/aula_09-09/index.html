<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Busca de Produtos</title>
</head>
<body>

    <h1>Busca de Produtos</h1>

    <input
        type="text"
        id="busca"
        placeholder="Digite um produto"
    >

    <button onclick="buscar()">
        Buscar
    </button>

    <hr>

    <div id="resultado"></div>

    <script>
        function buscar() {
            const termo = document.getElementById("busca").value;

            // ANTES 
            // O problema aqui é que o .innerHTML permite a inserção de código HTML, o que pode ser um risco de segurança

            // document.getElementById("resultado").innerHTML =
            //     "Você pesquisou por: " + termo;

            //Corrigido

            // Alterei o .innerHTML para .textContent assim o conteúdo é tratado como texto e não como código HTML

            document.getElementById("resultado").textContent =
                "Você pesquisou por: " + termo;

        }
    </script>

</body>
</html>
